# Paper-trading runner. GitHub's cron is best-effort and in practice dropped most runs (no runs at all
# during NSE hours on 9-10 Nov 2026), so the runner is a self-sustaining chain: each run loops for
# ~5.5 hours (step every 2 min in session, every 15 min outside it, polling dashboard commands each
# step) and then dispatches the next run itself. The cron below is only a backup to restart a broken
# chain; extra triggers just queue in the concurrency group. To stop everything, disable this workflow.
# It can never trade live: kavach.cli refuses --live under GitHub Actions.
name: engine
on:
  schedule:
    - cron: "7 1,3,9,15 * * *"       # backup restarts only (06:37, 08:37, 14:37, 20:37 IST)
  issues:
    types: [opened]
  workflow_dispatch:
concurrency:
  group: pages-state
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  actions: write          # to dispatch the next run in the chain
jobs:
  run:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'kavach:'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: pages }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: publish dashboard files
        run: |
          cp site/index.html site/app.js site/style.css pages/
          touch pages/.nojekyll
          git -C pages config user.name "kavach-bot"
          git -C pages config user.email "kavach-bot@users.noreply.github.com"
      - name: engine loop (2 min in session, 15 min outside; ~5.5 h, then chains the next run)
        env:
          KAVACH_STATE: pages/state
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m kavach.cli loop --site pages --push --github-commands --strategy fly_hold --every 120 --max-minutes 330 --chain
