# Paper-trading runner. GitHub's cron is best-effort (runs get delayed or dropped), so each run
# keeps itself alive through market hours: it steps every 2 minutes for up to ~58 minutes,
# publishing state + dashboard after every step and polling dashboard commands (GitHub issues).
# Two staggered triggers per hour start the next run; if one is still going, the next waits its turn.
# Outside market hours a run does a single step (applies commands, publishes) and exits.
# It can never trade live: kavach.cli refuses --live under GitHub Actions.
name: engine
on:
  schedule:
    - cron: "7,37 3-10 * * 1-5"      # 08:37-16:07 IST weekdays, off the :00/:15 rush
  issues:
    types: [opened]
  workflow_dispatch:
concurrency:
  group: pages-state
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  run:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'kavach:'))
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: pages }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: publish dashboard files
        run: |
          cp site/index.html site/app.js site/style.css pages/
          touch pages/.nojekyll
          git -C pages config user.name "kavach-bot"
          git -C pages config user.email "kavach-bot@users.noreply.github.com"
      - name: engine loop (every 2 min, up to 58 min, market hours only)
        env:
          KAVACH_STATE: pages/state
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python -m kavach.cli loop --site pages --push --github-commands --strategy fly_hold --every 120 --max-minutes 58
