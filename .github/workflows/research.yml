# Weekly research: refresh 10y Nifty + VIX, rerun the grid and promotion gates, publish report.html.
name: research
on:
  schedule:
    - cron: "17 4 * * 6"              # Saturday 09:47 IST
  workflow_dispatch:
concurrency:
  group: pages-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: pages }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m kavach.cli refresh || echo "refresh failed, using committed data"
      - run: python -m kavach.cli research
      - name: commit ledger + data, publish report
        run: |
          git config user.name "kavach-bot"; git config user.email "kavach-bot@users.noreply.github.com"
          git add data state/trials.jsonl
          git commit -qm "research: weekly refresh" && git push -q || echo "no main changes"
          cp report.html pages/report.html
          cd pages
          git config user.name "kavach-bot"; git config user.email "kavach-bot@users.noreply.github.com"
          git add report.html
          git commit -qm "research report" && git push -q || echo "no report changes"
