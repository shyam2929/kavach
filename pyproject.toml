[project]
name = "kavach"
version = "0.1.0"
description = "Risk-first volatility-edge system for Nifty weekly options"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8"]

[project.scripts]
kavach = "kavach.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
